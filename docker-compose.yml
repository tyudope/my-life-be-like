services:
  db:
    image: postgres:16
    container_name: mylifebelike-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - mylifebelike-data:/var/lib/postgresql/data

volumes:
  mylifebelike-data: